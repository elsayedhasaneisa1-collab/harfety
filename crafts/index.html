<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حساب الحرفي | حرفتي</title><link rel="stylesheet" href="../assets/css/style.css"><style>.account-card{width:min(620px,calc(100% - 28px));margin:7vh auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:30px;box-shadow:var(--shadow)}.account-card h1{margin:10px 0}.account-card p{color:var(--muted)}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}</style></head><body><main class="account-card"><div class="brand-mark">ح</div><h1>حساب الحرفي</h1><p id="account-status">جارٍ التحقق من حسابك…</p><div id="account-details"></div><div class="account-actions"><button id="logout" class="btn secondary" type="button">تسجيل الخروج</button><a class="btn primary" href="../auth/login.html">تسجيل الدخول</a></div></main><script type="module">import {supabase} from '../assets/js/supabase-config.js';const status=document.getElementById('account-status');const details=document.getElementById('account-details');const {data:{session}}=await supabase.auth.getSession();if(!session){location.replace('../auth/login.html')}else if(session.user.app_metadata?.role==='admin'){location.replace('../owner/index.html')}else{const u=session.user;status.textContent='تم تسجيل الدخول بنجاح.';const m=u.user_metadata||{};const rows=[['الاسم',m.full_name],['رقم الهاتف',u.phone],['الحرفة',m.craft],['المحافظة / المدينة',m.city],['سنوات الخبرة',m.experience_years],['نبذة',m.bio]].filter(x=>x[1]!==undefined&&x[1]!==null&&String(x[1]).trim()!=='');details.replaceChildren(...rows.map(([label,value])=>{const p=document.createElement('p');const b=document.createElement('b');b.textContent=label+': ';p.append(b,document.createTextNode(String(value)));return p;}));}document.getElementById('logout').addEventListener('click',async()=>{await supabase.auth.signOut();location.replace('../auth/login.html')});</script></body></html>
