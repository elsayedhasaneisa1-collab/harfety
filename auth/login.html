<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تسجيل الدخول | حرفتي</title><link rel="stylesheet" href="../assets/css/style.css"></head><body class="login-page"><main class="login-shell"><section class="login-brand"><div class="brand-mark big">ح</div><p class="eyebrow">منصة الحرفيين</p><h1>حرفتي</h1><p>سجّل دخولك لإدارة حسابك ومتابعة أعمالك.</p><div class="login-art" aria-hidden="true"><span>✦</span><span>⌁</span><span>◇</span></div></section><section class="login-card"><div class="mobile-brand"><span class="brand-mark">ح</span><b>حرفتي</b></div><p class="eyebrow">أهلاً بعودتك</p><h2>تسجيل الدخول</h2><p class="muted">استخدم رقم الهاتف وكلمة المرور.</p><div id="login-alert" class="alert hidden" role="alert"></div><form id="login-form"><label for="phone">رقم الهاتف</label><input id="phone" type="tel" autocomplete="username" required maxlength="20" placeholder="+2010xxxxxxxx" dir="ltr"><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128" placeholder="أدخل كلمة المرور" dir="ltr"><button id="toggle-password" class="eye-btn" type="button" aria-label="إظهار كلمة المرور">◉</button></div><button id="login-btn" class="btn primary full" type="submit">تسجيل الدخول</button></form><p style="text-align:center;margin-top:22px">أول مرة هنا؟ <a href="register.html" style="color:var(--brand);font-weight:800">أنشئ حساب حرفي</a></p><p class="security-note">🔒 لوحة الإدارة متاحة لحساب المسؤول المعتمد فقط. حسابات الحرفيين لا تحصل على صلاحيات الإدارة.</p><p class="footer-note">© <span id="year"></span> حرفتي</p></section></main><script type="module" src="../assets/js/auth.js"></script></body></html>
